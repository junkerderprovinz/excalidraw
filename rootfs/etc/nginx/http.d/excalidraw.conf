# One origin for everything the whiteboard needs. This is what lets the bundle
# use relative paths instead of a configured address: the page, the shared-link
# store and the collaboration socket all answer on whatever host the browser
# opened, so the image works unchanged on a LAN IP, behind a proxy, or on a
# subdomain.

upstream excalidraw_storage { server 127.0.0.1:8081; }
upstream excalidraw_room    { server 127.0.0.1:8082; }

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  listen 443 ssl default_server;
  http2 on;

  ssl_certificate     /config/cert.pem;
  ssl_certificate_key /config/key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  # A drawing is one blob and people paste screenshots into them.
  client_max_body_size 64m;

  # The shared-link store. The bundle asks for /api/v2/scenes; the backend
  # serves exactly that path, so this passes through unchanged.
  location /api/v2/ {
    proxy_pass http://excalidraw_storage;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The collaboration socket. Needs the upgrade headers, and a long read timeout:
  # an idle session that gets cut every 60 seconds looks like a broken feature.
  location /socket.io/ {
    proxy_pass http://excalidraw_room;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Fonts are served from this image, never from a CDN, so they may cache hard.
  location ~* \.(woff2?|ttf|otf)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # A single-page app: unknown paths are routes, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
