name: Build & Push Docker Image

# Builds the multi-arch image from the Dockerfile and pushes it to GHCR on every
# push to main (and manually). Tags: :latest and :sha-<short>. Also mirrors to
# Docker Hub (docker.io/<DOCKERHUB_USERNAME>/excalidraw) once the
# DOCKERHUB_USERNAME variable and the DOCKERHUB_TOKEN secret are both set; until
# then the build stays GHCR-only.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "templates/**"
      - ".github/release-notes/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/junkerderprovinz/excalidraw
  # Runs JS-based actions on Node 24, which silences the Node 20 deprecation
  # warning on the checkout and docker actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror, active only once DOCKERHUB_USERNAME (variable) and
      # DOCKERHUB_TOKEN (secret) are both set; otherwise skipped.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/excalidraw,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # Smoke-test gate: build the images, boot them and require them to serve /
      # before anything is pushed. A green Docker build only proves the image
      # builds, not that it starts.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: excalidraw:smoke-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build arm64 image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: excalidraw:smoke-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Both published arches have to boot, because :latest is multi-arch and a
      # green amd64 alone would let a broken arm64 image through. arm64 runs under
      # QEMU here, so it gets a larger boot budget.
      - name: "Smoke test: both arches must boot and serve /"
        run: |
          set -euo pipefail
          smoke() {
            local tag="$1" platform="$2" budget="$3"
            local name="exca-smoke-${platform##*/}"
            echo "::group::smoke ${platform}"
            docker run -d --name "$name" --platform "$platform" -p 8080:80 "$tag"
            for i in $(seq 1 "$budget"); do
              if curl -fsS -o /dev/null http://localhost:8080/; then
                echo "✅ ${platform} served / after ${i}s"
                docker rm -f "$name" >/dev/null
                echo "::endgroup::"
                return 0
              fi
              sleep 1
            done
            echo "❌ ${platform} did not serve / within ${budget}s, logs:"
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null
            echo "::endgroup::"
            return 1
          }
          smoke excalidraw:smoke-amd64 linux/amd64 60
          smoke excalidraw:smoke-arm64 linux/arm64 240

      # Non-blocking CVE scan of the locally built amd64 image. Reports HIGH and
      # CRITICAL (fixable only) to the Security tab; exit-code stays 0 because a
      # fresh advisory should surface, not block a release.
      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: excalidraw:smoke-amd64
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mirror the GitHub README to the Docker Hub repo's Overview, with the same
      # access token the push uses. A token with read, write and delete scope can
      # edit the description; the account password cannot, because Docker Hub's
      # legacy login endpoint refuses it with 401 once 2FA is on.
      - name: Docker Hub description sync ready?
        id: dhdesc
        if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
        env:
          PW: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$PW" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "DOCKERHUB_TOKEN not set, skipping Docker Hub description sync"; echo "go=false" >> "$GITHUB_OUTPUT"; fi
      # Never fatal: the image is already pushed, and a description that did not
      # update is cosmetic, not a reason to mark a good build red.
      - name: Sync README to Docker Hub
        if: ${{ steps.dhdesc.outputs.go == 'true' }}
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/excalidraw
          short-description: "Self-hosted Excalidraw that keeps to itself: links, collaboration and fonts all stay on your server."
          enable-url-completion: true
