name: Lint & Test

# Checks what this repo consists of: a Go store with its own tests, a Dockerfile,
# the shell and Python scripts that run at build and start, and two TypeScript
# files that replace upstream ones. The TypeScript is not type-checked here: it
# only compiles against Excalidraw's own tree, which the image build already does.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/assets/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go store
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  scripts:
    name: Dockerfile and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          # DL3008 and DL3018: apt and apk packages without a pinned version. The
          # base image is pinned and rebuilt regularly; pinning every package on
          # top means a broken build every time Alpine moves, for no security gain.
          ignore: DL3008,DL3018

      - name: Shell
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck rootfs/usr/local/bin/start.sh

      - name: Python
        run: python3 -m py_compile rootfs/usr/local/bin/patch-spa.py
